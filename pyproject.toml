[project]
name = "sql-agent-evals"
version = "0.1.0"
description = "Golden question set and evaluation pipeline for sql-agent over the Olist dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlglot>=30.23.0",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
